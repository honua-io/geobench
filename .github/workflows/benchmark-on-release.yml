name: Per-Release Benchmark (Honua Server)

# Triggered by honua-server on each release tag via repository_dispatch, or
# manually via workflow_dispatch for ad-hoc replays.
#
# Responsibilities:
#   1. Run the benchmark suite against the tagged honua-server image.
#   2. Measure cold-start latency (server startup → first successful request).
#   3. Compare p50/p95/p99 latency, RPS, and error rate against the stored
#      baseline and fail the job when any metric regresses beyond the threshold.
#   4. Upload raw results and any requested baseline candidate as workflow
#      artifacts for operator review. Never approve, commit or push results.
#
# The baseline JSON is stored at results/baselines/honua-baseline.json and
# remains tracked for compatibility. New approved records use published/;
# replacing this legacy baseline requires a separately reviewed source change.

on:
  repository_dispatch:
    types: [honua-server-release]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'honua-server release tag (e.g. v1.2.3). Used as image tag and results key.'
        required: true
        default: 'latest'
      honua_image:
        description: 'Full Docker image reference to benchmark. Defaults to ghcr.io/honua-io/honua-server:<tag>.'
        required: false
        default: ''
      regression_threshold:
        description: 'Regression budget as a decimal fraction (default 0.20 = 20%).'
        required: false
        default: '0.20'
      runs:
        description: 'k6 runs per test category (default 3).'
        required: false
        default: '3'
      save_baseline:
        description: 'Generate an unapproved baseline candidate in raw artifacts (true/false); never replaces the tracked baseline.'
        required: false
        default: 'false'
      evidence_only:
        description: 'Diagnostic campaign: skip Honua release regression/cold-start and baseline candidate checks.'
        type: boolean
        default: false
      servers:
        description: 'Servers to benchmark (space separated); custom selections require evidence_only.'
        default: 'honua'
      tests:
        description: 'Benchmark tracks (space separated); custom selections require evidence_only.'
        default: 'attribute-filter spatial-bbox concurrent'
      geoserver_image:
        description: 'Optional image; defaults to 3.0.1, or 3.0.x with GSR. Pin GSR as :3.0.x@sha256:<digest>.'
        default: ''
      gsr_enabled:
        description: 'Use the matching 3.0.x nightly + GSR profile (requires a 3.0.x image).'
        type: boolean
        default: false
      warmup:
        description: 'Warmup per track, e.g. 30s.'
        default: '30s'
      duration:
        description: 'Measurement per scenario, e.g. 60s.'
        default: '60s'

permissions:
  contents: read

concurrency:
  group: geobench-release-${{ github.event.client_payload.release_tag || github.event.inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.release_tag || github.event.inputs.release_tag || 'latest' }}
  HONUA_IMAGE_INPUT: ${{ github.event.client_payload.honua_image || github.event.inputs.honua_image || '' }}
  REGRESSION_THRESHOLD: ${{ github.event.client_payload.regression_threshold || github.event.inputs.regression_threshold || '0.20' }}
  RUNS: ${{ github.event.client_payload.runs || github.event.inputs.runs || '3' }}
  SAVE_BASELINE: ${{ github.event.client_payload.save_baseline || github.event.inputs.save_baseline || 'false' }}
  # Release regression checks remain Honua/core only; all outputs are raw evidence.
  EVIDENCE_ONLY: ${{ inputs.evidence_only && 'true' || 'false' }}
  SERVERS: ${{ inputs.servers || 'honua' }}
  TESTS: ${{ inputs.tests || 'attribute-filter spatial-bbox concurrent' }}
  GEOSERVER_IMAGE: ${{ inputs.geoserver_image || '' }}
  GEOSERVER_GSR_ENABLED: ${{ inputs.gsr_enabled && '1' || '0' }}
  COMPOSE_FILE: ${{ inputs.gsr_enabled && 'docker-compose.yml:docker-compose.gsr.yml' || 'docker-compose.yml' }}
  # Shortened warmup / duration for CI (full soak is for nightly deep-dive).
  ATTRIBUTE_FILTER_WARMUP: ${{ inputs.warmup || '30s' }}
  ATTRIBUTE_FILTER_DURATION: ${{ inputs.duration || '60s' }}
  SPATIAL_BBOX_WARMUP: ${{ inputs.warmup || '30s' }}
  SPATIAL_BBOX_DURATION: ${{ inputs.duration || '60s' }}
  CONCURRENT_WARMUP: ${{ inputs.warmup || '30s' }}
  CONCURRENT_DURATION: ${{ inputs.duration || '60s' }}
  WMS_GETMAP_WARMUP: ${{ inputs.warmup || '30s' }}
  WMS_GETMAP_DURATION: ${{ inputs.duration || '60s' }}
  GEOSERVICES_QUERY_WARMUP: ${{ inputs.warmup || '30s' }}
  GEOSERVICES_QUERY_DURATION: ${{ inputs.duration || '60s' }}
  GEOSERVICES_IDENTIFY_WARMUP: ${{ inputs.warmup || '30s' }}
  GEOSERVICES_IDENTIFY_DURATION: ${{ inputs.duration || '60s' }}
  PAGINATION_WARMUP: ${{ inputs.warmup || '30s' }}
  PAGINATION_DURATION: ${{ inputs.duration || '60s' }}
  WFS_GETFEATURE_WARMUP: ${{ inputs.warmup || '30s' }}
  WFS_GETFEATURE_DURATION: ${{ inputs.duration || '60s' }}
  WFS_FILTERED_WARMUP: ${{ inputs.warmup || '30s' }}
  WFS_FILTERED_DURATION: ${{ inputs.duration || '60s' }}
  WMS_REPROJECTION_WARMUP: ${{ inputs.warmup || '30s' }}
  WMS_REPROJECTION_DURATION: ${{ inputs.duration || '60s' }}
  WMS_GETFEATUREINFO_WARMUP: ${{ inputs.warmup || '30s' }}
  WMS_GETFEATUREINFO_DURATION: ${{ inputs.duration || '60s' }}
  WMS_FILTERED_WARMUP: ${{ inputs.warmup || '30s' }}
  WMS_FILTERED_DURATION: ${{ inputs.duration || '60s' }}
  WMTS_WARMUP: ${{ inputs.warmup || '30s' }}
  WMTS_DURATION: ${{ inputs.duration || '60s' }}
  WCS_WARMUP: ${{ inputs.warmup || '30s' }}
  WCS_DURATION: ${{ inputs.duration || '60s' }}
  GEOSERVICES_DIAG_WARMUP: ${{ inputs.warmup || '30s' }}
  GEOSERVICES_DIAG_DURATION: ${{ inputs.duration || '60s' }}
  GEOSERVICES_EXPORT_WARMUP: ${{ inputs.warmup || '30s' }}
  GEOSERVICES_EXPORT_DURATION: ${{ inputs.duration || '60s' }}
  AUDIT_SHAPES: '1'

jobs:
  benchmark:
    name: Benchmark ${{ github.event.client_payload.release_tag || github.event.inputs.release_tag || 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout geobench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate campaign selection and resolve GeoServer profile
        run: python3 scripts/benchmark_config.py workflow

      - name: Resolve Honua image reference
        if: env.HONUA_SELECTED == 'true'
        id: image
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [ -n "${HONUA_IMAGE_INPUT}" ]; then
            image="${HONUA_IMAGE_INPUT}"
          elif [ "${tag}" = "latest" ]; then
            image="ghcr.io/honua-io/honua-server:latest"
          else
            image="ghcr.io/honua-io/honua-server:${tag}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${image}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Pull Honua image
        if: env.HONUA_SELECTED == 'true'
        run: |
          echo "Pulling ${{ steps.image.outputs.image }} ..."
          docker pull "${{ steps.image.outputs.image }}"

      - name: Generate benchmark dataset
        run: python3 data/small/generate.py

      - name: Set RESULT_TIMESTAMP
        id: ts
        run: echo "ts=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Run benchmark suite
        env:
          HONUA_IMAGE: ${{ steps.image.outputs.image }}
          RESULT_TIMESTAMP: ${{ steps.ts.outputs.ts }}
        run: |
          RUNS="${RUNS}" \
          SERVERS="${SERVERS}" \
          TESTS="${TESTS}" \
          AUDIT_SHAPES="${AUDIT_SHAPES}" \
          ATTRIBUTE_FILTER_WARMUP="${ATTRIBUTE_FILTER_WARMUP}" \
          ATTRIBUTE_FILTER_DURATION="${ATTRIBUTE_FILTER_DURATION}" \
          SPATIAL_BBOX_WARMUP="${SPATIAL_BBOX_WARMUP}" \
          SPATIAL_BBOX_DURATION="${SPATIAL_BBOX_DURATION}" \
          CONCURRENT_WARMUP="${CONCURRENT_WARMUP}" \
          CONCURRENT_DURATION="${CONCURRENT_DURATION}" \
          CONTINUE_ON_K6_FAILURE=1 \
          bash scripts/run-benchmark.sh

      - name: Measure cold-start latency
        if: ${{ !inputs.evidence_only }}
        env:
          HONUA_IMAGE: ${{ steps.image.outputs.image }}
          RESULT_TIMESTAMP: ${{ steps.ts.outputs.ts }}
        run: |
          COLD_START_RUNS=3 \
          COLD_START_OUTPUT="results/${{ steps.ts.outputs.ts }}/honua-cold-start.json" \
          bash scripts/measure-cold-start.sh

      - name: Check for regressions
        if: ${{ !inputs.evidence_only }}
        id: regression
        env:
          RESULT_TIMESTAMP: ${{ steps.ts.outputs.ts }}
        run: |
          # Capture the exit code without failing this step so that subsequent
          # steps (artifact upload, summary) still run.  The "Fail on regression"
          # step below will surface the failure with a clear message.
          set +e
          baseline_options=()
          if [ "${SAVE_BASELINE}" = "true" ]; then
            baseline_options+=(--allow-invalid-baseline)
          fi
          python3 scripts/check-regression.py \
            --results-dir "results/${RESULT_TIMESTAMP}" \
            --baseline "results/baselines/honua-baseline.json" \
            "${baseline_options[@]}" \
            --server honua \
            --tests attribute-filter spatial-bbox concurrent \
            --expected-runs "${RUNS}" \
            --threshold "${REGRESSION_THRESHOLD}" \
            --cold-start "results/${RESULT_TIMESTAMP}/honua-cold-start.json"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Generate unapproved baseline candidate
        if: ${{ !inputs.evidence_only && env.SAVE_BASELINE == 'true' && steps.regression.outputs.exit_code == '0' }}
        env:
          RESULT_TIMESTAMP: ${{ steps.ts.outputs.ts }}
        run: |
          python3 scripts/check-regression.py \
            --results-dir "results/${RESULT_TIMESTAMP}" \
            --server honua \
            --tests attribute-filter spatial-bbox concurrent \
            --expected-runs "${RUNS}" \
            --cold-start "results/${RESULT_TIMESTAMP}/honua-cold-start.json" \
            --save-baseline "results/${RESULT_TIMESTAMP}/honua-baseline.json" \
            --release-tag "${{ steps.image.outputs.tag }}"
          echo "Unapproved baseline candidate generated; operator review is required."

      - name: Upload benchmark artifacts
        if: ${{ always() && steps.ts.outputs.ts != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geobench-results-${{ steps.image.outputs.tag }}-${{ steps.ts.outputs.ts }}
          path: results/${{ steps.ts.outputs.ts }}/
          retention-days: 90

      - name: Summarise results
        if: ${{ always() && steps.ts.outputs.ts != '' }}
        env:
          RESULT_TIMESTAMP: ${{ steps.ts.outputs.ts }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "## Benchmark Results — ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw evidence only. Review and explicit SHA256-bound approval are required before publication." >> "$GITHUB_STEP_SUMMARY"
          report="results/${RESULT_TIMESTAMP}/report.md"
          if [ -f "${report}" ]; then
            cat "${report}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Report not generated (benchmark may have partially failed)._" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cold_start="results/${RESULT_TIMESTAMP}/honua-cold-start.json"
          if [ -f "${cold_start}" ]; then
            echo "### Cold-Start Latency" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/summarise-cold-start.py "${cold_start}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on regression
        if: ${{ !inputs.evidence_only && steps.regression.outputs.exit_code != '0' }}
        run: |
          echo "Benchmark regression detected. See 'Check for regressions' step for details."
          exit 1
